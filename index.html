            padding: 0;

        }

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;

            width: 100%;

        }

            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
            margin-bottom: 20px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-bar {
            background: white;
            height: 100%;
            transition: width 0.4s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 14px;
            margin-top: 15px;
            opacity: 0.9;
        }

        .content {
            padding: 50px;
        }

        .question-section {
            display: none;
        }

        .question-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-header {
            margin-bottom: 30px;
        }

        .question-number {
            color: #667eea;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.6;
        }

        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .answer-option {
            background: #f8f9fa;
            border: 2px solid #ddd;
            padding: 18px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .answer-option::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #667eea;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .answer-option:hover:not(:disabled) {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .answer-option:hover:not(:disabled)::before {
            opacity: 1;
        }

        .answer-option.disabled {
            cursor: not-allowed;
        }

        .answer-option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .answer-option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .feedback-message {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.6;
            display: none;
        }

        .feedback-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-correct {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }

        .feedback-incorrect {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-prev {
            background: #e9ecef;
            color: #333;
        }

        .btn-prev:hover:not(:disabled) {
            background: #dee2e6;
            transform: translateX(-3px);
        }

        .btn-next {
            background: #667eea;
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            background: #5568d3;
            transform: translateX(3px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-section {
            display: none;
            text-align: center;
            padding: 50px;
        }

        .results-section.show {
            display: block;
            animation: fadeIn 0.5s ease;

            font-size: 36px;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .score-display {
            font-size: 72px;
            font-weight: 700;
            color: #667eea;
            margin: 30px 0;
        }

        .percentage-display {
            font-size: 48px;
            font-weight: 600;
            color: #764ba2;
            margin: 20px 0;
        }

        .result-message {
            font-size: 20px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .pass-status {
            font-size: 24px;
            font-weight: 700;

            padding: 20px;
            border-radius: 10px;
        }

        .pass-status.passed {

            color: #155724;

        }

        .pass-status.failed {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .restart-btn {
            background: #667eea;
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            background: #5568d3;
            transform: scale(1.05);

            .content {

                padding: 30px;

                font-size: 24px;
            }

            .score-display {
                font-size: 48px;
            }

            .percentage-display {
                font-size: 36px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                min-width: 100%;
            }
        }
    </style>
</head>

        let selectedQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = {};

        function selectRandomQuestions() {
            const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
            selectedQuestions = shuffled.slice(0, 40);
        }

        function init() {
            selectRandomQuestions();
            displayQuestion();
        }

        function displayQuestion() {
            const question = selectedQuestions[currentIndex];
            document.getElementById('questionNumber').textContent = `Question ${currentIndex + 1}`;
            document.getElementById('questionText').textContent = question.question;

            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';

            question.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-option';
                btn.textContent = answer;
                btn.onclick = () => selectAnswer(index);
                answersContainer.appendChild(btn);
            });

            document.getElementById('feedbackMessage').classList.remove('show');
            document.getElementById('feedbackMessage').textContent = '';

            updateProgress();
            updateButtons();
        }

        function selectAnswer(index) {
            if (answered[currentIndex] !== undefined) return;

            const question = selectedQuestions[currentIndex];
            const buttons = document.querySelectorAll('.answer-option');
            const feedbackMsg = document.getElementById('feedbackMessage');

            answered[currentIndex] = index;

            buttons.forEach((btn, i) => {
                btn.classList.add('disabled');
                if (i === question.correct) {
                    btn.classList.add('correct');
                } else if (i === index) {
                    btn.classList.add('incorrect');
                }
            });

            if (index === question.correct) {
                score++;
                feedbackMsg.textContent = '✓ Correct !';
                feedbackMsg.className = 'feedback-message show feedback-correct';
            } else {
                feedbackMsg.textContent = `✗ Incorrect. La réponse correcte est : "${question.answers[question.correct]}"`;
                feedbackMsg.className = 'feedback-message show feedback-incorrect';
            }

            updateButtons();
        }

        function nextQuestion() {
            if (currentIndex < selectedQuestions.length - 1) {
                currentIndex++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                displayQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentIndex + 1) / selectedQuestions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentIndex + 1} sur ${selectedQuestions.length}`;
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            const nextBtn = document.getElementById('nextBtn');
            if (currentIndex === selectedQuestions.length - 1) {
                nextBtn.textContent = 'Terminer';
            } else {
                nextBtn.textContent = 'Suivant →';
            }
        }

        function showResults() {
            document.getElementById('questionSection').classList.remove('active');
            document.getElementById('resultsSection').classList.add('show');

            const percentage = Math.round((score / selectedQuestions.length) * 100);
            document.getElementById('scoreDisplay').textContent = `${score}/${selectedQuestions.length}`;
            document.getElementById('percentageDisplay').textContent = `${percentage}%`;

            const passStatus = document.getElementById('passStatus');
            if (percentage >= 80) {
                passStatus.textContent = '✓ RÉUSSI';
                passStatus.className = 'pass-status passed';
                document.getElementById('resultMessage').textContent = 'Bravo ! Vous avez réussi l\'examen civique.';
            } else {
                passStatus.textContent = '✗ NON RÉUSSI';
                passStatus.className = 'pass-status failed';
                document.getElementById('resultMessage').textContent = 'Malheureusement, vous n\'avez pas atteint le score minimum de 80%. Continuez vos révisions !';
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
